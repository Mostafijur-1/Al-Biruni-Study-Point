name: Phase 2 Academic DB Validation

on:
  workflow_dispatch:
    inputs:
      mongodb_version:
        description: MongoDB binary version cached for the disposable replica set
        required: true
        default: 8.2.6
        type: string

permissions:
  contents: read

concurrency:
  group: phase2-academic-db-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate transactional academic workflows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONGOMS_VERSION: ${{ inputs.mongodb_version }}
      MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore MongoDB test binary
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/mongodb-binaries
          key: mongodb-memory-${{ runner.os }}-${{ inputs.mongodb_version }}

      - name: Install dependencies without lifecycle downloads
        run: npm ci --ignore-scripts

      - name: Run unit and contract tests
        run: npm test

      - name: Run disposable replica-set integration test
        id: integration
        shell: bash
        run: |
          mkdir -p evidence
          set -o pipefail
          npm run test:academic-db:memory 2>&1 | tee evidence/phase2-academic-db.log

      - name: Upload review log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase2-academic-db-${{ github.sha }}
          path: evidence/phase2-academic-db.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write review summary
        if: always()
        shell: bash
        run: |
          echo "## Phase 2 academic DB validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Integration outcome: \`${{ steps.integration.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database: temporary loopback replica set only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Review the uploaded log before recording rollout evidence." >> "$GITHUB_STEP_SUMMARY"
